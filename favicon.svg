<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0d10"/>
  
  <!-- Letter F -->
  <path d="M22,20 L22,44 M22,20 L34,20 M22,32 L32,32" 
        stroke="#2fd77c" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Letter W with chart -->
  <polyline points="34,38 37,30 40,36 43,28 46,34" 
            stroke="#2fd77c" stroke-width="2.5" 
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pulse dot -->
  <circle cx="46" cy="34" r="2" fill="#2fd77c">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>